[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "access-governance-warehouse"
version = "0.1.0"
description = "Minimal warehouse portfolio project for access governance analytics with dbt, DuckDB, and deterministic synthetic data."
readme = "README.md"
authors = [
    { name = "Shiki Ichitose", email = "149179099+ShikiIchitose@users.noreply.github.com" }
]
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "dbt-duckdb",
  "duckdb",
  "pandas",
  "pyarrow",
  "tabulate",
  "dbt-bigquery",
  "google-cloud-bigquery",
]

# ---- dev deps (uv) ----
[dependency-groups]
dev = [
  "ruff",
]

# ---- dev deps (pip extras) ----
[project.optional-dependencies]
dev = [
  "ruff",
]

[tool.setuptools]
packages = []

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402", "I001"]

[tool.ruff.format]
quote-style = "double"
